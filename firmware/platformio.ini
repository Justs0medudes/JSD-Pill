; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32c3-supermini

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino
lib_deps = bodmer/TFT_eSPI@^2.5.43

upload_protocol = dfu

build_flags =
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_PID=0x5740
    -D USBD_VID=0x0483
    -D USB_MANUFACTURER="STMicroelectronics"
    -D USB_PRODUCT="JSD Pill"

monitor_speed = 115200
monitor_dtr = 1

[env:esp32c3-supermini]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
lib_deps = lovyan03/LovyanGFX

monitor_speed = 115200
; Force native USB CDC for Serial monitor output
build_flags = 
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -Wno-attributes

platform_packages =
    platformio/toolchain-riscv32-esp

debug_tool = esp-builtin
debug_init_break = tbreak setup
